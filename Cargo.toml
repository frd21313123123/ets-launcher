[package]
name = "ets-launcher"
version = "0.1.0"
edition = "2024"
description = "Native Rust archive downloader prototype for ETS2"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
decrypt_truck = "1.3.6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.33", default-features = false }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
librqbit = "8.1.1"
open = "5"
reqwest = { version = "0.12", features = ["stream"] }
rfd = "0.15"
regex = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = { version = "0.24", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "process"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
wry = "0.57.1"
junction = "1"

[dev-dependencies]
aes = "0.8"
cbc = "0.1"
flate2 = "1"
tempfile = "3"
sha1 = "0.10"

[profile.release]
strip = true
opt-level = 2

[profile.dev]
debug = 0
